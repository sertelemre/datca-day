name: Refresh Datça duty pharmacies
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datca-content-updates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/pharmacies/duty.test.mjs
      - run: node scripts/pharmacies/update.mjs
      - name: Publish a changed shift
        run: |
          git add public/data/pharmacy-duty.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Datça pharmacy duty hours'
          git pull --rebase origin main
          git push origin HEAD:main
